name: store_controller
description: "Store Controller App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.4 <4.0.0"

# =====================================================
# DEPENDENCIES
# =====================================================
dependencies:
  # Firebase (Web + Mobile)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0       # Für Login/Registrierung
  cloud_firestore: ^5.0.0    # Deine neue Datenbank (ersetzt Sheets)
  firebase_storage: ^12.0.0  # Für Produktbilder

  exif: ^2.0.1
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Core
  http: any
  uuid: ^4.4.0

  # Navigation & UI
  go_router: any
  google_fonts: any
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0

  # Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network & System
  url_launcher: ^6.2.5
  connectivity_plus: ^6.0.5

  # Location (optional)
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.2



# =====================================================
# DEV DEPENDENCIES
# =====================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# =====================================================
# FLUTTER CONFIG
# =====================================================
flutter:
  uses-material-design: true
  generate: true

  # Fonts
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

  # Assets
  assets:
    - assets/icon/apps_icon.png
    - assets/icon/Aldeep.png
    - assets/icon/setting_icon.png
    - assets/icon/wolf.png

# =====================================================
# FLUTTER LAUNCHER ICONS
# (ANDROID / IOS / WEB)  ✅ KORREKT
# =====================================================
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/apps_icon.png"

  web:
    generate: true
    image_path: "assets/icon/apps_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
