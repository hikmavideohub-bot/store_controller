name: store_controller
description: "Store Controller App"
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.10.4 <4.0.0"

# =====================================================
# DEPENDENCIES
# =====================================================
dependencies:
  package_info_plus: ^8.0.0
  emoji_picker_flutter: ^4.4.0
  font_awesome_flutter: ^10.6.0
  country_picker: ^2.0.27
  dio: ^5.3.2
  # Firebase (Web + Mobile)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0       # Für Login/Registrierung
  cloud_firestore: ^5.0.0    # Deine neue Datenbank (ersetzt Sheets)
  firebase_storage: ^12.0.0  # Für Produktbilder
  cloud_functions: ^5.0.0    # Für Stripe Checkout
  google_sign_in: ^6.2.1     # Google Sign-in

  exif: ^2.0.1
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Core
  http: any
  uuid: ^4.4.0

  # Navigation & UI
  go_router: any
  google_fonts: any
  provider: ^6.1.2  # Für MVVM State Management
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0

  # Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network & System
  url_launcher: ^6.2.5
  connectivity_plus: ^6.0.5
  share_plus: ^10.1.0

  # Location (optional)
  google_maps_flutter: ^2.5.0 # oder aktuellste Version
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.14.4
  web: ^1.0.0



# =====================================================
# DEV DEPENDENCIES
# =====================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# =====================================================
# FLUTTER CONFIG
# =====================================================
flutter:
  uses-material-design: true
  generate: true

  # Fonts
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

  # Assets
  assets:
    - assets/icon/app_icon.png
    - assets/icon/wolf.png
    - assets/icon/google_logo.png

# =====================================================
# FLUTTER LAUNCHER ICONS
# (ANDROID / IOS / WEB)  ✅ KORREKT
# =====================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Hier ist der neue Pfad mit "/icon/":
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

  # Auch hier den neuen Pfad eintragen:
  adaptive_icon_background: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"


  # --------------------------
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
